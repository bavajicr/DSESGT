<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2133;--mute:#5a6479;--line:#dbe0ec;--brand:#1f4fd8;--brand2:#e8eefc;--ok:#0b7a43}
@media (prefers-color-scheme:dark){:root{--bg:#0f121b;--card:#171b27;--ink:#e8ebf4;--mute:#9aa3b8;--line:#2a3042;--brand:#7ea2ff;--brand2:#1c2540;--ok:#4bd68a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Telugu","Nirmala UI",Gautami,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{padding:14px 16px;background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){header{background:#1c2c5c}}
header h1{margin:0 0 3px;font-size:18px;line-height:1.3}
header .credit{font-size:13px;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;opacity:.92}
.bar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px}
.bar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar .sp{flex:1}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
h2{margin:0 0 2px;font-size:19px}
h2 small{display:block;font-size:15px;font-weight:600;color:var(--mute)}
.test{display:inline-block;margin:8px 0 4px;padding:4px 10px;border-radius:8px;background:var(--brand2);font-size:13px;font-weight:700}
ul{margin:8px 0 0;padding-left:20px}
li{margin:9px 0}
li .te{display:block;color:var(--mute);font-size:15px}
li b{color:var(--brand)}
footer{text-align:center;padding:16px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
footer strong{color:var(--ink)}
@media print{body{display:none!important}}
</style>

var cur = 0, lang = "both";
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function rich(s){return esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");}
function bar(){
  var h=""; N.forEach(function(s,i){ h+='<button data-i="'+i+'" class="'+(i===cur?'on':'')+'">'+(i+1)+'. '+esc(s.short)+'</button>'; });
  h+='<span class="sp"></span><button data-l="both" class="'+(lang==="both"?"on":"")+'">EN+తె</button><button data-l="en" class="'+(lang==="en"?"on":"")+'">EN</button><button data-l="te" class="'+(lang==="te"?"on":"")+'">తె</button>';
  document.getElementById("bar").innerHTML=h;
}
function body(){
  var s=N[cur], h='<div class="card"><h2>'+(lang!=="te"?esc(s.en):esc(s.te))+(lang==="both"?'<small>'+esc(s.te)+'</small>':'')+'</h2><span class="test">Practice test: '+esc(s.test)+'</span><ul>';
  s.items.forEach(function(it){
    h+='<li>';
    if(lang!=="te") h+='<span class="en">'+rich(it[0])+'</span>';
    if(lang!=="en") h+='<span class="te">'+rich(it[1])+'</span>';
    h+='</li>';
  });
  h+='</ul></div>';
  document.getElementById("body").innerHTML=h;
}
document.getElementById("bar").onclick=function(e){
  var t=e.target, i=t.getAttribute&&t.getAttribute("data-i"), l=t.getAttribute&&t.getAttribute("data-l");
  if(i!==null&&i!==undefined&&i!==""){cur=+i;} else if(l){lang=l;} else return;

};
